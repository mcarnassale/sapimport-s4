# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

# Modo híbrido: data source rapService (IMPPCH+PCH1-6, ImpSetup) vai pro backend RAP de verdade
# (ABAP Trial, via proxy); mainService (demais CBOs + lookups) continua no mock, porque ainda não
# existe no RAP. Subir com `npm run start-rap` (scripts/start-rap.mjs passa SAP_PASSWORD pro proxy).
# A URL do backend é a mesma do SAP_URL do .mcp.json/adt.mjs — se o IP do host (Default Switch)
# mudar após reboot, atualizar nos três lugares.

specVersion: "4.0"
metadata:
  name: acx.sapimport.s4
type: application
server:
  customMiddleware:
    - name: pucomex-middleware
      afterMiddleware: compression
    # Pedidos de compra e CBOs YY1_ACX_*: tenant S/4HANA Cloud real (ver ui5-s4.yaml). Tem que vir
    # antes do fiori-tools-proxy, cujo backend /sap pegaria esses caminhos também.
    - name: s4-api-proxy
      afterMiddleware: compression
      configuration:
        url: https://my404561-api.s4hana.cloud.sap
        paths:
          - /sap/opu/odata4/sap/api_purchaseorder_2/
          - /sap/opu/odata/sap/YY1_ACX_
          - /sap/opu/odata/sap/API_PRODUCT_SRV/
          - /sap/opu/odata/sap/API_BUSINESS_PARTNER/
    - name: fiori-tools-proxy
      afterMiddleware: s4-api-proxy
      configuration:
        ignoreCertErrors: false
        backend:
          - path: /sap
            url: http://172.22.240.1:50000
            client: "001"
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
    - name: sap-fe-mockserver
      beforeMiddleware: csp
      configuration:
        mountPath: /
        services:
          - urlPath: /odata/v4/import-process/srvd_a2x/sap/importprocess/0001
            metadataPath: ./webapp/localService/mainService/metadata.xml
            mockdataPath: ./webapp/localService/mainService/data
            generateMockData: true
        annotations: []
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
