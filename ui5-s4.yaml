# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

# Modo híbrido S/4: pedidos de compra vêm da API REAL do tenant S/4HANA Cloud (api_purchaseorder_2,
# Communication Arrangement ACRUX_PED_COMPRA / SAP_COM_0053) e os Custom Business Objects
# YY1_ACX_* (arrangement YY1_ACX_SAPIMPORT) vêm do tenant REAL via s4-api-proxy, com o usuário de
# comunicação em S4_API_USER/S4_API_PASSWORD; só os lookups (mainService) ficam no mock.
# Subir com `npm run start-s4`.

specVersion: "4.0"
metadata:
  name: acx.sapimport.s4
type: application
server:
  customMiddleware:
    - name: pucomex-middleware
      afterMiddleware: compression
    - name: s4-api-proxy
      afterMiddleware: compression
      configuration:
        url: https://my404561-api.s4hana.cloud.sap
        paths:
          - /sap/opu/odata4/sap/api_purchaseorder_2/
          - /sap/opu/odata/sap/YY1_ACX_
          - /sap/opu/odata/sap/API_PRODUCT_SRV/
          - /sap/opu/odata/sap/API_BUSINESS_PARTNER/
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
    - name: sap-fe-mockserver
      beforeMiddleware: csp
      configuration:
        mountPath: /
        services:
          - urlPath: /odata/v4/import-process/srvd_a2x/sap/importprocess/0001
            metadataPath: ./webapp/localService/mainService/metadata.xml
            mockdataPath: ./webapp/localService/mainService/data
            generateMockData: true
        annotations: []
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
